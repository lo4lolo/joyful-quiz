# Render.com 블루프린트: GitHub 저장소를 연결하면 이 설정대로 웹앱이 만들어져요.
services:
  - type: web
    name: joyful-quiz
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/info
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TEACHER_PIN
        sync: false   # 대시보드에서 선생님만 아는 숫자를 넣어요 (방 만들기 잠금)
      - key: ALLOWED_ORIGINS
        sync: false   # GitHub Pages 화면 주소 (예: https://아이디.github.io) — 여러 개면 쉼표로
