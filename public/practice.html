<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>혼자 카트 연습 · 즐거운 퀴즈</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/learning.css"><link rel="stylesheet" href="css/practice.css"></head>
<body class="paper"><main id="setup" class="practice-wrap">
<header class="practice-header"><a class="btn sm" href="teacher.html">← 퀴즈 보관함</a><span class="badge y">학생 초대 없이 · 혼자 연습</span></header>
<section class="practice-hero"><div><p class="eyebrow">즐거운 퀴즈 · 카트 연습장</p><h1>첫 바퀴는<br><span>가볍게, 신나게!</span></h1><p>길을 따라 달리고, 퀴즈 게이트에서 생각해요.<br>맞히면 부스터! 틀려도 해설을 읽고 다시 도전해요.</p></div><img src="assets/img/kart_hero.webp" alt="연습장에서 기다리는 분홍 카트" width="380" height="285"></section>
<section class="practice-config card"><div class="practice-fields"><label>연습할 문제<select class="input" id="practice-set"></select></label><label>어디로 달릴까요?<select class="input" id="practice-track"></select></label><label>조작 방식<select class="input" id="practice-device"><option value="pc">⌨️ 키보드</option><option value="touch">👆 화면 버튼 · 태블릿</option></select></label></div>
<label class="assist-choice"><input id="practice-assist" type="checkbox" checked><span><b>🧭 주행 도움 켜기</b><small>핸들을 놓으면 길을 따라 달려요. 익숙해지면 직접 운전해 보세요.</small></span></label>
<div class="practice-steps"><div><b>01 · 출발</b><span>← → 핸들 · ↑ 가속</span></div><div><b>02 · 퀴즈 게이트</b><span>카트가 천천히 가는 동안 생각해요</span></div><div><b>03 · 완주와 복습</b><span>한 바퀴 후 나의 학습 노트 확인</span></div></div>
<button class="btn mint xl" id="practice-start">🏁 연습 시작하기</button><p class="practice-note">연습 기록은 이 탭에서만 사용해요. 실제 수업 방·순위·학생 기록에는 반영되지 않아요.</p></section></main>
<div id="practice-game" hidden></div><button class="btn sm" id="practice-stop" hidden>연습 마치기</button>
<main id="practice-result" class="practice-wrap" hidden><section class="card center"><p class="eyebrow">카트 연습 완료</p><h1 id="practice-title">멋진 도전이었어요!</h1><p id="practice-score"></p><button class="btn mint lg" id="practice-again">다른 트랙도 도전하기</button> <a class="btn" href="teacher.html">보관함으로</a></section><div id="practice-review"></div></main>
<script type="module" src="js/practice.js"></script></body></html>
