# 화면(public 폴더)을 GitHub Pages 로 배포해요. 저장소 Settings → Pages → Source: GitHub Actions.
# 저장소 Settings → Secrets and variables → Actions → Variables 에 SERVER_URL (예: https://joyful-quiz.onrender.com) 을 넣으면
# 학생·선생님 화면이 그 실시간 서버로 연결돼요.
name: 화면 배포 (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 게임 규칙과 배포 검사
        run: npm test
      - name: 서버 주소를 검증하고 앱을 Pages 루트에 준비
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: node tools/prepare-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
      - id: deploy
        uses: actions/deploy-pages@v4
